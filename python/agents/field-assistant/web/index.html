<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f5f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Field">
  <title>Field Assistant</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">Field Assistant</div>
      <div class="sub"><span id="date"></span> <span id="who"></span></div>
    </div>
    <span id="offline" class="offline" hidden>Offline</span>
    <button id="settings" class="icon-btn" aria-label="Settings">⚙</button>
  </header>
  <main id="main"><div class="busy"><span class="spinner"></span>Loading…</div></main>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
